name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test LapelKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      # LapelKit is deliberately free of CoreAudio and AVFoundation types above
      # the hardware bridge, so the whole suite runs on a CI machine with no
      # audio interface attached.
      - name: Test
        run: swift test

      - name: Fail on warnings
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log
